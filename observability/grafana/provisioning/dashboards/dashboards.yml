apiVersion: 1
providers:
  # Each sub-directory of /var/lib/grafana/dashboards becomes a Grafana folder:
  #   FAST/   FAST Operations (business), FAST Services (producer/consumer replicas)
  #   Kafka/  Kafka Consumer Groups & Broker
  - name: FAST lab
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
