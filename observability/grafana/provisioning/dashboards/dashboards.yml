apiVersion: 1
providers:
  # Each sub-directory of /var/lib/grafana/dashboards becomes a Grafana folder:
  #   FAST/ Havale/ EFT/  per-flow team dashboards: Business, Developer, SRE
  #   Platform/           Platform Services, Flink (all flows), Kafka
  # All except Platform/kafka-consumer-groups.json are generated by
  # observability/grafana/generate_team_dashboards.py.
  - name: FAST lab
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
