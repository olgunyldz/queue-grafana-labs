# FAST alerts for consumer group "fast-transfer-consumers-dotnet" (all consumer replicas together). To change a limit, edit the
# threshold "params" (and "for") of the rule below. All counts are over a sliding 5 minute window of what the
# consumer group consumed (Kafka committed offsets, see observability/prometheus/rules/fast.yml).
#
# | Alert                                      | Condition                          | Severity | For |
# |--------------------------------------------|------------------------------------|----------|-----|
# | FAST send/outcome mismatch                 | > 10%                              | warning  | 5m  |
# | FAST send volume low (business hours)      | < 100                              | warning  | 5m  |
# | FAST send volume high                      | > 6000                             | critical | 5m  |
# | FAST outcome volume low (business hours)   | < 100                              | warning  | 5m  |
# | FAST outcome volume high                   | > 6000                             | critical | 5m  |
# | FAST failed count high                     | > 500                              | critical | 5m  |
# | FAST failed/success ratio high             | > 20%                              | critical | 5m  |
# | FAST stuck transfers high                  | > 50 waiting > 30s (reconciler)    | warning  | 5m  |
# | FAST reconciler down                       | no Kafka Streams instance RUNNING  | critical | 2m  |
#
# Low-volume alerts are only evaluated during business hours (fast:business_hours == 1);
# outside those hours the query is empty and the rule stays Normal.
# The last two rules are not per consumer group: they read the reconciler's own metrics.
apiVersion: 1
groups:
  - orgId: 1
    name: fast-reconciliation
    folder: FAST
    interval: 30s
    rules:
      - uid: fast-send-outcome-mismatch
        title: FAST send/outcome mismatch
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:outcome_mismatch:ratio5m{consumergroup="fast-transfer-consumers-dotnet"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.1] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          domain: fast
        annotations:
          summary: >-
            FAST send/outcome mismatch for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ humanizePercentage $values.A.Value }}{{ end }}
          description: >-
            The difference between fast_send and its outcomes (success + failed) is above 10%.{{ if $values.A }} Current value: {{ humanizePercentage $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-send-volume-low
        title: FAST send volume low (business hours)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:sent:increase5m{consumergroup="fast-transfer-consumers-dotnet"} and on () (fast:business_hours == 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [100] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          domain: fast
        annotations:
          summary: >-
            FAST send volume low (business hours) for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }}{{ end }}
          description: >-
            Fewer than 100 fast_send were consumed in the last 5 minutes during business hours (09:00-18:00 Istanbul).{{ if $values.A }} Current value: {{ printf "%.0f" $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-send-volume-high
        title: FAST send volume high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:sent:increase5m{consumergroup="fast-transfer-consumers-dotnet"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6000] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          domain: fast
        annotations:
          summary: >-
            FAST send volume high for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }}{{ end }}
          description: >-
            More than 6000 fast_send were consumed in the last 5 minutes.{{ if $values.A }} Current value: {{ printf "%.0f" $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-outcome-volume-low
        title: FAST outcome volume low (business hours)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:outcome:increase5m{consumergroup="fast-transfer-consumers-dotnet"} and on () (fast:business_hours == 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [100] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          domain: fast
        annotations:
          summary: >-
            FAST outcome volume low (business hours) for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }}{{ end }}
          description: >-
            Fewer than 100 outcomes (fast_send_success + fast_send_failed) were consumed in the last 5 minutes during business hours.{{ if $values.A }} Current value: {{ printf "%.0f" $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-outcome-volume-high
        title: FAST outcome volume high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:outcome:increase5m{consumergroup="fast-transfer-consumers-dotnet"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6000] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          domain: fast
        annotations:
          summary: >-
            FAST outcome volume high for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }}{{ end }}
          description: >-
            More than 6000 outcomes (fast_send_success + fast_send_failed) were consumed in the last 5 minutes.{{ if $values.A }} Current value: {{ printf "%.0f" $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-failed-count-high
        title: FAST failed count high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:failed:increase5m{consumergroup="fast-transfer-consumers-dotnet"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          domain: fast
        annotations:
          summary: >-
            FAST failed count high for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }}{{ end }}
          description: >-
            More than 500 fast_send_failed were consumed in the last 5 minutes.{{ if $values.A }} Current value: {{ printf "%.0f" $values.A.Value }}.{{ end }}
        isPaused: false
      - uid: fast-failed-success-ratio-high
        title: FAST failed/success ratio high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'fast:failed_success:ratio5m{consumergroup="fast-transfer-consumers-dotnet"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          domain: fast
        annotations:
          summary: >-
            FAST failed/success ratio high for consumer group {{ $labels.consumergroup }}{{ if $values.A }}: {{ humanizePercentage $values.A.Value }}{{ end }}
          description: >-
            The fast_send_failed / fast_send_success ratio is above 20% for the last 5 minutes.{{ if $values.A }} Current value: {{ humanizePercentage $values.A.Value }}.{{ end }}
        isPaused: false
      # ---- Reconciler (Kafka Streams) -------------------------------------------------------
      - uid: fast-stuck-transfers-high
        title: FAST stuck transfers high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: 'sum(fast_kstreams_reconciler_stuck{job="fast-reconciler"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          domain: fast
        annotations:
          summary: >-
            FAST stuck transfers high{{ if $values.A }}: {{ printf "%.0f" $values.A.Value }} transfers waiting > 30s{{ end }}
          description: >-
            More than 50 fast_send have been waiting longer than 30 seconds for their outcome, for 5 minutes.
            The transfers that never get an outcome are written to the fast_transfer_unmatched topic after 10 minutes.
        isPaused: false
      - uid: fast-reconciler-down
        title: FAST reconciler down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              # Instances whose Kafka Streams client is RUNNING (state 2); 0 if none is scraped at all.
              expr: 'count(kafka_stream_client_state{job="fast-reconciler"} == 2) or vector(0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          domain: fast
        annotations:
          summary: FAST reconciler down (no Kafka Streams instance RUNNING)
          description: >-
            No fast-reconciler instance has been RUNNING for 2 minutes. Completion time, bank, amount and stuck-transfer
            metrics are not updated; the volume alerts (based on Kafka offsets) keep working.
        isPaused: false
