# Load balancer in front of the dotnet-producer replicas (host port 18081).
# Docker's embedded DNS returns one A record per replica; with a variable in
# proxy_pass nginx re-resolves every 5s and round-robins across all of them,
# so scaling or restarting the producers needs no nginx restart.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;

    location / {
        set $producer http://dotnet-producer:8080;
        proxy_pass $producer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        # Shows which replica answered (handy when testing the load balancing).
        add_header X-Upstream $upstream_addr always;
    }
}
