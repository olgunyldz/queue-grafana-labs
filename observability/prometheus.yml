global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Every replica is scraped separately: Docker's DNS returns one A record per replica.
  - job_name: mock-producer
    dns_sd_configs:
      - names: [mock-producer]
        type: A
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: dotnet
  - job_name: mock-consumer
    dns_sd_configs:
      - names: [mock-consumer]
        type: A
        port: 2114
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: dotnet
  # Kafka Streams reconciler (FAST only, "kstreams" compose profile). Uses the same reconciler_*
  # metric contract as Flink; impl="kstreams" tells the implementations apart.
  - job_name: fast-reconciler
    dns_sd_configs:
      - names: [fast-reconciler]
        type: A
        port: 9400
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: kstreams
      - target_label: flow
        replacement: fast
  # Flink TaskManagers of every per-flow cluster (reconciler operator metrics live here).
  # flow (fast | havale | eft) is taken from the service name: flink-<flow>-taskmanager.
  - job_name: flink-reconcilers
    dns_sd_configs:
      - names: [flink-fast-taskmanager, flink-havale-taskmanager, flink-eft-taskmanager]
        type: A
        port: 9249
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: flink
      - target_label: flink_component
        replacement: taskmanager
      - source_labels: [__meta_dns_name]
        regex: flink-(.+)-taskmanager
        target_label: flow
    # Flink's Prometheus reporter puts the MetricGroup path and the label keys into the metric name,
    # e.g. flink_taskmanager_job_task_operator_reconciler_outcome_role_bank_code_bank_transfers_total.
    # Map them back to reconciler_<metric>, the contract shared with the Kafka Streams reconciler.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: flink_taskmanager_job_task_operator_reconciler_(?:.*_)?(transfers_total|volume_try_total|completion_seconds_bucket|completion_seconds_count|completion_seconds_sum|amount_try_bucket|amount_try_count|amount_try_sum|failures_total|unmatched_total|duplicates_total|invalid_events_total|pending|stuck|orphan_outcomes)
        target_label: __name__
        replacement: reconciler_$1
      # Flink sanitizes decimal bucket labels (0.05 -> 0_05, +Inf -> _Inf).
      - source_labels: [le]
        regex: '([0-9]+)_([0-9]+)'
        target_label: le
        replacement: '$1.$2'
      - source_labels: [le]
        regex: _Inf
        target_label: le
        replacement: +Inf
      # Flink replaces every non-alphanumeric character of a label value with "_" ("QNB / Enpara.com" ->
      # "QNB___Enpara_com"). Restore the display names (same as the Kafka Streams reconciler, Banks.java):
      # bank from bank_code, sender_bank (completion histogram) from its sanitized form.
      - source_labels: [bank_code]
        regex: '00010'
        target_label: bank
        replacement: 'Ziraat Bankası'
      - source_labels: [bank_code]
        regex: '00012'
        target_label: bank
        replacement: 'Halkbank'
      - source_labels: [bank_code]
        regex: '00015'
        target_label: bank
        replacement: 'Vakıfbank'
      - source_labels: [bank_code]
        regex: '00032'
        target_label: bank
        replacement: 'TEB'
      - source_labels: [bank_code]
        regex: '00046'
        target_label: bank
        replacement: 'Akbank'
      - source_labels: [bank_code]
        regex: '00062'
        target_label: bank
        replacement: 'Garanti BBVA'
      - source_labels: [bank_code]
        regex: '00064'
        target_label: bank
        replacement: 'İş Bankası'
      - source_labels: [bank_code]
        regex: '00067'
        target_label: bank
        replacement: 'Yapı Kredi'
      - source_labels: [bank_code]
        regex: '00099'
        target_label: bank
        replacement: 'ING Bank'
      - source_labels: [bank_code]
        regex: '00111'
        target_label: bank
        replacement: 'QNB / Enpara.com'
      - source_labels: [bank_code]
        regex: '00134'
        target_label: bank
        replacement: 'Denizbank'
      - source_labels: [bank_code]
        regex: '00203'
        target_label: bank
        replacement: 'Albaraka Türk'
      - source_labels: [bank_code]
        regex: '00205'
        target_label: bank
        replacement: 'Kuveyt Türk'
      - source_labels: [bank_code]
        regex: '00206'
        target_label: bank
        replacement: 'Türkiye Finans'
      - source_labels: [bank_code]
        regex: '00209'
        target_label: bank
        replacement: 'Ziraat Katılım'
      - source_labels: [bank_code]
        regex: '00210'
        target_label: bank
        replacement: 'Vakıf Katılım'
      - source_labels: [bank_code]
        regex: '00231'
        target_label: bank
        replacement: 'Papara'
      - source_labels: [bank_code]
        regex: '00238'
        target_label: bank
        replacement: 'Hayhay'
      - source_labels: [sender_bank]
        regex: 'Ziraat_Bankasi'
        target_label: sender_bank
        replacement: 'Ziraat Bankası'
      - source_labels: [sender_bank]
        regex: 'Vakifbank'
        target_label: sender_bank
        replacement: 'Vakıfbank'
      - source_labels: [sender_bank]
        regex: 'Garanti_BBVA'
        target_label: sender_bank
        replacement: 'Garanti BBVA'
      - source_labels: [sender_bank]
        regex: 'Is_Bankasi'
        target_label: sender_bank
        replacement: 'İş Bankası'
      - source_labels: [sender_bank]
        regex: 'Yapi_Kredi'
        target_label: sender_bank
        replacement: 'Yapı Kredi'
      - source_labels: [sender_bank]
        regex: 'ING_Bank'
        target_label: sender_bank
        replacement: 'ING Bank'
      - source_labels: [sender_bank]
        regex: 'QNB___Enpara_com'
        target_label: sender_bank
        replacement: 'QNB / Enpara.com'
      - source_labels: [sender_bank]
        regex: 'Albaraka_Turk'
        target_label: sender_bank
        replacement: 'Albaraka Türk'
      - source_labels: [sender_bank]
        regex: 'Kuveyt_Turk'
        target_label: sender_bank
        replacement: 'Kuveyt Türk'
      - source_labels: [sender_bank]
        regex: 'Turkiye_Finans'
        target_label: sender_bank
        replacement: 'Türkiye Finans'
      - source_labels: [sender_bank]
        regex: 'Ziraat_Katilim'
        target_label: sender_bank
        replacement: 'Ziraat Katılım'
      - source_labels: [sender_bank]
        regex: 'Vakif_Katilim'
        target_label: sender_bank
        replacement: 'Vakıf Katılım'
  # Flink JobManagers of every per-flow cluster (job status, checkpoints, restarts).
  - job_name: flink-jobmanager
    dns_sd_configs:
      - names: [flink-fast-jobmanager, flink-havale-jobmanager, flink-eft-jobmanager]
        type: A
        port: 9249
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: flink
      - target_label: flink_component
        replacement: jobmanager
      - source_labels: [__meta_dns_name]
        regex: flink-(.+)-jobmanager
        target_label: flow
  - job_name: kafka
    static_configs:
      - targets: [kafka-jmx-exporter:5556]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
