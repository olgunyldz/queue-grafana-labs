global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Every replica is scraped separately: Docker's DNS returns one A record per replica.
  - job_name: dotnet-producer
    dns_sd_configs:
      - names: [dotnet-producer]
        type: A
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: dotnet
  - job_name: dotnet-consumer
    dns_sd_configs:
      - names: [dotnet-consumer]
        type: A
        port: 2114
        refresh_interval: 10s
    relabel_configs:
      - target_label: impl
        replacement: dotnet
  - job_name: fast-reconciler
    dns_sd_configs:
      - names: [fast-reconciler]
        type: A
        port: 9400
        refresh_interval: 10s
  - job_name: kafka
    static_configs:
      - targets: [kafka-jmx-exporter:5556]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
