# Alert test: 30 transfers/s for 7 minutes (~9000 fast_send and ~9000 outcomes / 5m).
# > 6000 / 5m -> "FAST send volume high" and "FAST outcome volume high"
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: ramp-up
      duration: 30
      arrivalRate: 5
      rampTo: 30
    - name: spike
      duration: 420
      arrivalRate: 30
  http:
    timeout: 10

scenarios:
  - name: send-then-success
    weight: 9
    flow:
      - function: newTransfer
      - post: { url: /events/fast_send, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
      - think: 0.2
      - post: { url: /events/fast_send_success, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }

  - name: send-then-failed
    weight: 1
    flow:
      - function: newTransfer
      - post: { url: /events/fast_send, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
      - think: 0.2
      - post: { url: /events/fast_send_failed, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
