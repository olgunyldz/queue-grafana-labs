# Request backlog: only FAST incoming requests are sent (10 -> 100/s). Stop the FAST reconciler
# (docker compose stop flink-taskmanager; this pauses all three jobs) first: lag on fast_incoming_request grows and drains
# once it starts again; stuck transfers grow after 30 s.
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: warmup
      duration: 15
      arrivalRate: 2
    - name: request-burst
      duration: 60
      arrivalRate: 10
      rampTo: 100
  http:
    timeout: 10

scenarios:
  - name: request-only
    flow:
      - function: newTransfer
      - post:
          url: /events/fast/incoming/request
          beforeRequest: fastBody
          expect:
            - statusCode: 202
