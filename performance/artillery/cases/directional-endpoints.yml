# Smoke test for all mock-producer success/failed endpoints.
# It only sends requests; service lifecycle and Docker operations are external to this scenario.
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  phases:
    - name: endpoint-smoke
      duration: 1
      arrivalCount: 1
  http:
    timeout: 10

scenarios:
  - name: directional-endpoint-contract
    flow:
      - post:
          url: /events/fast/incoming/success
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/fast/incoming/failed
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/fast/outgoing/success
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/fast/outgoing/failed
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/havale/success
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/havale/failed
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/eft/incoming/success
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/eft/incoming/failed
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/eft/outgoing/success
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
      - post:
          url: /events/eft/outgoing/failed
          beforeRequest: directionalBody
          expect:
            - statusCode: 202
