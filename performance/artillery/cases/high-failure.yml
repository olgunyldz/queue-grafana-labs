# Alert test: half of the transfers fail for 7 minutes.
# ~1500 failed outcomes / 5m (> 500)  -> "Transfer failed count high" (flow fast)
# failed / success ~ 1.0 (> 20%)        -> "Transfer failed/success ratio high" (flow fast)
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: high-failure
      duration: 420
      arrivalRate: 10
  http:
    timeout: 10

scenarios:
  - name: send-then-success
    weight: 5
    flow:
      - function: newTransfer
      - post: { url: /events/fast/incoming/request, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
      - think: 0.2
      - post: { url: /events/fast/incoming/success, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }

  - name: send-then-failed
    weight: 5
    flow:
      - function: newTransfer
      - post: { url: /events/fast/incoming/request, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
      - think: 0.2
      - post: { url: /events/fast/incoming/failed, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
