# Alert test: very low traffic for 7 minutes (~60 transfers / 5m, < 100).
# Run it between 09:00 and 18:00 Istanbul time -> "Transfer request volume low" and
# "Transfer outcome volume low" (flow fast). Outside business hours these alerts stay Normal.
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: low-volume
      duration: 420
      arrivalRate: 0.2
  http:
    timeout: 10

scenarios:
  - name: send-then-success
    flow:
      - function: newTransfer
      - post: { url: /events/fast/incoming/request, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
      - think: 0.2
      - post: { url: /events/fast/incoming/success, beforeRequest: fastBody, expect: [{ statusCode: 202 }] }
