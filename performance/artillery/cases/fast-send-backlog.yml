# fast_send backlog: consumer is stopped, only fast_send is sent.
# Lag on the fast_send topic grows; it drains once the consumer starts again.
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: warmup
      duration: 15
      arrivalRate: 2
    - name: fast-send-burst
      duration: 60
      arrivalRate: 10
      rampTo: 100
  http:
    timeout: 10

scenarios:
  - name: fast-send-only
    flow:
      - function: newTransfer
      - post:
          url: /events/fast/incoming/request
          beforeRequest: fastBody
          expect:
            - statusCode: 202
