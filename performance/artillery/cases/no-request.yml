# No request: only FAST incoming outcome events (success / failed) are sent. The request topic stays
# flat; the reconciler stores orphan outcomes that expire as outcome_without_send after 10 minutes.
config:
  target: http://127.0.0.1:8080
  processor: ../processors/fast.cjs
  plugins:
    expect: {}
  phases:
    - name: warmup
      duration: 15
      arrivalRate: 2
    - name: outcomes-only
      duration: 60
      arrivalRate: 20
  http:
    timeout: 10

scenarios:
  - name: success-without-request
    weight: 8
    flow:
      - function: newTransfer
      - post:
          url: /events/fast/incoming/success
          beforeRequest: fastBody
          expect:
            - statusCode: 202

  - name: failed-without-request
    weight: 2
    flow:
      - function: newTransfer
      - post:
          url: /events/fast/incoming/failed
          beforeRequest: fastBody
          expect:
            - statusCode: 202
