# Shared settings of the Flink session cluster (see the Flink section below).
x-flink-image: &flink-image
  image: flink-reconciler:local
  pull_policy: never
  restart: unless-stopped
  volumes:
    - ./volumes/flink-checkpoints:/opt/flink/checkpoints
  environment:
    JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:4.4.0
    # Legacy FAST topics, directional FAST/Havale/EFT topics and reconciler result topics.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        for topic in fast_incoming_request fast_incoming_success fast_incoming_failed fast_outgoing_request fast_outgoing_success fast_outgoing_failed havale_request havale_success havale_failed eft_incoming_request eft_incoming_success eft_incoming_failed eft_outgoing_request eft_outgoing_success eft_outgoing_failed fast_transfer_matched fast_transfer_unmatched havale_transfer_matched havale_transfer_unmatched eft_transfer_matched eft_transfer_unmatched fast_transfer_status havale_transfer_status eft_transfer_status ledger_commands ledger_results; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic "$$topic" --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  # Official prometheus/jmx_exporter 1.7.0 jar, pinned and checksum-verified (see its Dockerfile).
  kafka-jmx-exporter:
    build: ./observability/kafka-jmx-exporter
    image: kafka-jmx-exporter:local
    command: [ "5556", "/etc/jmx-exporter/config.yml" ]
    volumes:
      - ./observability/kafka-jmx-exporter/config.yml:/etc/jmx-exporter/config.yml:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
      # Protocol version the exporter speaks, not the broker version: Kafka 4.x brokers still accept the
      # 3.9 protocol (they dropped only pre-2.1 protocols). Verified against the Kafka 4.4 broker here.
      - --kafka.version=3.9.0
      - --topic.filter=^[^_].*
      - --group.filter=.*
      - --offset.show-all
    ports:
      - "9308:9308"
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Mock producer (C# / .NET 10), 2 replicas behind the producer-lb load balancer.
  mock-producer:
    build:
      context: ./dotnet
      dockerfile: MockProducer/Dockerfile
    image: mock-producer:local
    deploy:
      replicas: 2
    environment:
      KAFKA_BROKERS: kafka:9092
      HTTP_ADDR: http://0.0.0.0:8080
      EVENT_NAMES: fast_incoming_request,fast_incoming_success,fast_incoming_failed,fast_outgoing_request,fast_outgoing_success,fast_outgoing_failed,havale_request,havale_success,havale_failed,eft_incoming_request,eft_incoming_success,eft_incoming_failed,eft_outgoing_request,eft_outgoing_success,eft_outgoing_failed
    expose:
      - "8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Single entry point for the producer replicas: http://127.0.0.1:8080
  producer-lb:
    image: nginx:1.29.3-alpine
    volumes:
      - ./observability/nginx/producer-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - mock-producer

  # One mock consumer process listens to every transfer topic.
  mock-consumer:
    build:
      context: ./dotnet
      dockerfile: MockConsumer/Dockerfile
    image: mock-consumer:local
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_SUBSCRIPTIONS: eft_incoming=eft_incoming_request,eft_incoming_success,eft_incoming_failed;eft_outgoing=eft_outgoing_request,eft_outgoing_success,eft_outgoing_failed;havale=havale_request,havale_success,havale_failed;fast_incoming=fast_incoming_request,fast_incoming_success,fast_incoming_failed;fast_outgoing=fast_outgoing_request,fast_outgoing_success,fast_outgoing_failed
      METRICS_ADDR: http://0.0.0.0:2114
    expose:
      - "2114"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Mock account ledger for the transfer saga: blocks, settles and releases amounts on the saga's
  # commands and answers on ledger_results. BLOCK_REJECT_RATE is the share of blocks rejected for
  # insufficient balance.
  ledger:
    build: ./ledger
    image: ledger:local
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      BLOCK_REJECT_RATE: "0.1"
      LEDGER_LATENCY_MS: "5-20"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---- Flink reconcilers -------------------------------------------------------------------
  # One Flink session cluster (one JobManager / UI, three TaskManagers) running one job per flow:
  # flink-fast-reconciler, flink-havale-reconciler, flink-eft-reconciler. Each job has its own state,
  # checkpoint directory (volumes/flink-checkpoints/<flow>), consumer group and Kafka transactional
  # ids; the JobManager and the TaskManagers are shared. flink-job-supervisor submits the jobs and
  # resubmits them from their latest checkpoint when they are gone (e.g. after a JobManager restart).
  # Flink UI (all jobs): http://localhost:18081

  # Builds flink-reconciler:local once (the other Flink services reuse it with pull_policy: never;
  # building one tag from several services in parallel fails with "image ... already exists")
  # and prepares one checkpoint directory per flow.
  flink-checkpoint-init:
    build: ./flink/reconciler
    image: flink-reconciler:local
    user: "0:0"
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - mkdir -p /opt/flink/checkpoints/fast /opt/flink/checkpoints/havale /opt/flink/checkpoints/eft && chown -R 9999:9999 /opt/flink/checkpoints
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints

  flink-jobmanager:
    <<: *flink-image
    command: jobmanager
    ports:
      - "18081:8081"
    expose:
      - "9249"
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully

  # 3 x 5 slots = 15; the three jobs use 3 x 3 = 9. If one TaskManager is lost, 10 slots remain,
  # so all three jobs can still be scheduled.
  flink-taskmanager:
    <<: *flink-image
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        taskmanager.numberOfTaskSlots: 5
    deploy:
      replicas: 3
    expose:
      - "9249"
    depends_on:
      flink-jobmanager:
        condition: service_started

  # Keeps one job per flow running (docker/supervise-jobs.sh). A job cancelled from the UI stays
  # stopped; start it again with:
  #   docker compose exec flink-job-supervisor /opt/flink/docker/supervise-jobs.sh start <flow>
  flink-job-supervisor:
    image: flink-reconciler:local
    pull_policy: never
    restart: unless-stopped
    user: "9999:9999"
    entrypoint: [ "/opt/flink/docker/supervise-jobs.sh" ]
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints
    environment:
      JOBMANAGER: flink-jobmanager:8081
      FLOWS: fast havale eft
      PARALLELISM: "3"
      SUPERVISE_INTERVAL: "30"
      # Job settings, read by each job's main() when it is submitted:
      KAFKA_BROKERS: kafka:9092
      PENDING_THRESHOLD: 30s
      MATCH_TTL: 10m
      CHECKPOINT_INTERVAL: 10s
      JAVA_TOOL_OPTIONS: --add-opens=java.base/java.util=ALL-UNNAMED
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./volumes/prometheus:/prometheus
    depends_on:
      - mock-producer
      - mock-consumer
      - flink-jobmanager
      - kafka-jmx-exporter
      - kafka-exporter

  loki:
    image: grafana/loki:3.7.9
    command: [ "-config.file=/etc/loki/config.yml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - ./volumes/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    command: [ "run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data" ]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/alloy:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
