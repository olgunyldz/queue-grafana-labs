services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:4.4.0
    # One topic per FAST event (fast_send, fast_send_success, fast_send_failed) and the reconciler's
    # result topics (fast_transfer_matched, fast_transfer_unmatched).
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        for topic in fast_send fast_send_success fast_send_failed fast_transfer_matched fast_transfer_unmatched; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic "$$topic" --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    command: [ "5556", "/etc/jmx-exporter/config.yml" ]
    volumes:
      - ./observability/kafka-jmx-exporter/config.yml:/etc/jmx-exporter/config.yml:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
      - --kafka.version=3.9.0
      - --topic.filter=^[^_].*
      - --group.filter=.*
      - --offset.show-all
    ports:
      - "9308:9308"
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # FAST producer (C# / .NET 10), 2 replicas behind the producer-lb load balancer.
  dotnet-producer:
    build:
      context: ./dotnet
      dockerfile: FastTransfer.Producer/Dockerfile
    image: fast-transfer-producer:local
    deploy:
      replicas: 2
    environment:
      KAFKA_BROKERS: kafka:9092
      HTTP_ADDR: http://0.0.0.0:8080
    expose:
      - "8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Single entry point for the producer replicas: http://127.0.0.1:8080
  producer-lb:
    image: nginx:1.29.3-alpine
    volumes:
      - ./observability/nginx/producer-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - dotnet-producer

  # FAST consumer (C# / .NET 10), 2 replicas in the same consumer group.
  # Kafka splits the partitions between them (range assignor, see ConsumerApp.cs).
  dotnet-consumer:
    build:
      context: ./dotnet
      dockerfile: FastTransfer.Consumer/Dockerfile
    image: fast-transfer-consumer:local
    deploy:
      replicas: 2
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPICS: fast_send,fast_send_success,fast_send_failed
      KAFKA_GROUP: fast-transfer-consumers-dotnet
      METRICS_ADDR: http://0.0.0.0:2114
    ports:
      # One host port per replica (2114 and 2115); Prometheus scrapes each replica via Docker DNS.
      - "2114-2115:2114"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # FAST reconciler (Java / Kafka Streams): matches fast_send with its outcome by transaction_id and
  # produces the FAST business metrics. State is in RocksDB + a changelog topic, so instances can be
  # added, removed or restarted without losing in-flight transfers (one standby replica per task).
  fast-reconciler:
    build: ./reconciler
    image: fast-reconciler:local
    deploy:
      replicas: 2
    environment:
      KAFKA_BROKERS: kafka:9092
      APPLICATION_ID: fast-reconciler
      FAST_PENDING_THRESHOLD: 30s
      FAST_MATCH_TTL: 10m
      NUM_STANDBY_REPLICAS: "1"
      PROCESSING_GUARANTEE: exactly_once_v2
      METRICS_PORT: "9400"
    ports:
      - "9400-9401:9400"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Apache Flink replacement reconciler. It is intentionally separate from the
  # Kafka Streams reconciler above so both implementations can be compared.
  flink-jobmanager:
    build: ./flink-reconciler
    image: fast-flink-reconciler:local
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    ports:
      - "18082:8081"
    expose:
      - "9249"
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-checkpoint-init:
        condition: service_completed_successfully

  flink-checkpoint-init:
    image: fast-flink-reconciler:local
    user: "0:0"
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - chown -R 9999:9999 /opt/flink/checkpoints
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints

  flink-taskmanager:
    image: fast-flink-reconciler:local
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "3"
    expose:
      - "9249"
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_started

  flink-reconciler-submit:
    image: fast-flink-reconciler:local
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - >-
        until curl -fsS http://flink-jobmanager:8081/overview >/dev/null; do sleep 2; done; /opt/flink/bin/flink run -d -m flink-jobmanager:8081 -p 3 /opt/flink/usrlib/fast-flink-reconciler.jar
    environment:
      KAFKA_BROKERS: kafka:9092
      APPLICATION_ID: fast-flink-reconciler
      JAVA_TOOL_OPTIONS: --add-opens=java.base/java.util=ALL-UNNAMED
      FAST_PENDING_THRESHOLD: 30s
      FAST_MATCH_TTL: 10m
      CHECKPOINT_INTERVAL: 10s
      PARALLELISM: "3"
    volumes:
      - ./volumes/flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./volumes/prometheus:/prometheus
    depends_on:
      - dotnet-producer
      - dotnet-consumer
      - fast-reconciler
      - flink-taskmanager
      - flink-jobmanager
      - kafka-jmx-exporter
      - kafka-exporter

  loki:
    image: grafana/loki:3.7.9
    command: [ "-config.file=/etc/loki/config.yml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - ./volumes/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    command: [ "run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data" ]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/alloy:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
